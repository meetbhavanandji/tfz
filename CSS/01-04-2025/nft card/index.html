<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="nft">
        <div class="card">

            <img class="equilibrium"
                src="/nft-preview-card-component-main/nft-preview-card-component-main/images/image-equilibrium.jpg"
                alt="equilibrium">

            <h2>Equilibrium #3429</h2>

            <p>Our Equilibrium collection promotes balance and calm.</p>

            <div class="description">
                <div class="div1">
                    <img class="ethereum"
                        src="/nft-preview-card-component-main/nft-preview-card-component-main/images/icon-ethereum.svg"
                        alt="icon-ethereum"><span style="color: #00fff8;">0.0041 ETH</span>
                </div>
                <div class="div2">
                    <img class="icon-clock"
                        src="/nft-preview-card-component-main/nft-preview-card-component-main/images/icon-clock.svg"
                        alt="icon-ethereum"><span style="color: hsl(215, 32%, 27%); "> 3 days left</span>
                </div>
            </div>
            <hr>
            <div class="footer">
                <img src="/nft-preview-card-component-main/nft-preview-card-component-main/images/image-avatar.png"
                    alt="avatar">
                <div>
                    <span style="color: hsl(215, 32%, 27%); ">Creation of</span>
                    <span style="color: hsl(0, 0%, 70%);">Jules Wyvern</span>
                </div>
            </div>
        </div>

    </div>
    </div>
    </div>
</body>

</html>
