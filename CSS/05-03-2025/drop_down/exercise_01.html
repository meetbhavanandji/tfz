<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drop_down</title>
    <style>
      body {
        margin: 0;
      }
      .drop_down {
        position: relative;
        display: inline-block;
      }
      .drop_down_content {
        display: none;
        position: absolute;
        min-width: 50px;
        min-width: 140px;
        padding: 14px 16px;
        background-color: #f9f9f9;
        box-shadow: 0px 8px 12px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }
      .drop_down:hover .drop_down_content {
        background-color: #f1f1f1;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="drop_down">
      <span>Hover here</span>
      <div class="drop_down_content">
        <p>Hello World</p>
      </div>
    </div>
  </body>
</html>
