<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* body {
        margin: 0;
      } */

      .navbar {
        list-style-type: none;
        padding: 0;
        margin: 0;
        background-color: #38444d;
        overflow: hidden;
      }

      li {
        float: left;
      }

      li a,
      .dropbtn {
        display: inline-block;
        color: white;
        text-align: center;
        text-decoration: none;
        padding: 14px 16px;
      }

      li a:hover,
      .dropdown:hover .dropbtn {
        background-color: red;
      }

      li.dropdown {
        display: inline-block;
      }

      .dropdown_content {
        margin-left: 9%;
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        z-index: 1;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      }

      .dropdown_content a {
        color: black;
        padding: 12px 16px;
        display: block;
        text-decoration: none;
        text-align: left;
      }

      .dropdown_content a:hover {
        background-color: #f1f1f1;
      }

      .dropdown:hover .dropdown_content {
        display: block;
      }
    </style>
  </head>
  <body>
    <ul class="navbar">
      <li><a href="#">Home</a></li>
      <li><a href="#">News</a></li>
      <div class="dropdown">
        <a class="dropbtn">Dropdown</a>
        <div class="dropdown_content">
          <a href="#">Link 1</a>
          <a href="#">Link 2</a>
          <a href="#">Link 3</a>
        </div>
      </div>
    </ul>
    <h3>Dropdown Menu inside a Navigation Bar</h3>
    <p>Hover over the "Dropdown" link to see the dropdown menu.</p>
  </body>
</html>
