<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attribute selector</title>
    <style>
      p [class] {
        background-color: lightgreen;
      }
      p [target="_blank"] {
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <h2>element [attribute] {CSS}</h2>
    <p>here in selector direct select attribute</p>
    <p class="one"><a href="www.google.com" target="_blank">Hello</a></p>
    <p class="one"><a href="www.google.com" target="_blank">Hello</a></p>
    <hr />
    <h2>element [attribute="value"] {CSS}</h2>
    <p>it select specific target is equal blank</p>
    <p><a href="#" target="_blank">target="_blank"</a></p>
    <p><a href="#" target="_self">target="_self"</a></p>
    <p><a href="#" target="_blank">target="_blank"</a></p>
    <hr>
    <h2>element [attribute~="value"] {CSS}</h2>
    <p></p>
  </body>
</html>
