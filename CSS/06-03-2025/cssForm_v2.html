<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive CSS Form</title>
    <style>
      * {
        box-sizing: border-box;
      }

      input[type="text"],
      select,
      textarea {
        width: 100%;
        resize: vertical;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      label {
        display: inline-block;
        padding: 12px 12px 12px 0;
      }

      .container {
        padding: 20px;
        border-radius: 5px;
        background-color: #f2f2f2;
      }

      .col_01 {
        width: 25%;
        float: left;
        margin-top: 6px;
      }

      .col_02 {
        width: 75%;
        float: left;
        margin-top: 6px;
      }

      input[type="submit"] {
        float: right;
        margin-top: 10px;
        padding: 10px 12px;
        background-color: #04aa6d;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
      }

      input[type="submit"]:hover {
        background-color: #45a049;
      }

      .row::after {
        content: "";
        clear: both;
        display: table;
      }
      @media screen and (max-width: 600px) {
        .col_01,
        .col_02,
        .inpur[type="submit"] {
          width: 100%;
          margin-top: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <form action="action.php">
        <div class="row">
          <div class="col_01">
            <label for="fname">First Name</label>
          </div>
          <div class="col_02">
            <input
              type="text"
              name="fname"
              id="fname"
              placeholder="Your name.."
            />
          </div>
        </div>
        <div class="row">
          <div class="col_01">
            <label for="lname">Last Name</label>
          </div>
          <div class="col_02">
            <input
              type="text"
              name="lname"
              id="lname"
              placeholder="Your last name.."
            />
          </div>
        </div>
        <div class="row">
          <div class="col_01">
            <label for="country">Country</label>
          </div>
          <div class="col_02">
            <select name="country" id="country">
              <option value="australia">Australia</option>
              <option value="caneda">Caneda</option>
              <option value="usa">USA</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col_01">
            <label for="subject">subject</label>
          </div>
          <div class="col_02">
            <textarea
              name="subject"
              id="subject"
              placeholder="write something..."
              style="height: 200px"
            ></textarea>
          </div>
        </div>
        <div class="row">
          <input type="submit" value="Submit" />
        </div>
      </form>
    </div>
  </body>
</html>
