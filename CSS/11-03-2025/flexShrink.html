<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex items</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: row;
            background-color: DodgerBlue;
        }

        .container>div {
            background-color: #f1f1f1;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
            flex-shrink: 1;
        }

        #item_01 {
            flex-shrink: 2;
        }
    </style>
</head>

<body>
    <main>
        <h1>Flex shrink</h1>

        <div class="container">
            <div id="item_01" class="item">2</div>
            <div id="item_02" class="item">1</div>
            <div id="item_03" class="item">1</div>
            <div id="item_04" class="item">1</div>
            <div id="item_05" class="item">1</div>
        </div>
    </main>
</body>

</html>
