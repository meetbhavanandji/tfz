<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>container properties</title>
    <style>
        .container {
            display: flex;
            border: 2px solid black;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            align-content: center;
            gap: 20px;
            height: 800px;
        }

        .box {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 100px;
            width: 100px;
            background-color: dodgerblue;
            font-size: 20pt;
            flex: 1 1 0;    /* flex grow, flex shrink, flex basis*/
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>

</html>
