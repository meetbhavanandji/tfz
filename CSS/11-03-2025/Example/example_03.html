<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>item properties</title>
    <style>
        .container{
            display: flex;
            height: 500px;
            gap: 5px;
            border: 2px solid black;

        }
        #box01{
            flex-grow: 5;
        }
        .box{
            flex-grow: 1;
            height: 100px;
            width: 100px;
            background-color: dodgerblue;
            font-size: 20pt;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box01" class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
