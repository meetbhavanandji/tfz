<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>container properties</title>
    <style>
        .container{
            display: flex;
            border: 2px solid black;
            flex-direction: row;  
            justify-content: center;      
             align-items: flex-start;    
             gap: 20px;     
            height: 500px;
        }
        .box{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 100px;
            width: 100px;
            background-color: dodgerblue;
            font-size: 20pt;
        }
        #box_01{
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box_01" class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
