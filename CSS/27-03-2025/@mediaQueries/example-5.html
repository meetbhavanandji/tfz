<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menus</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            background-color: #333;
            overflow: hidden;
        }

        div a {
            display: block;
            text-decoration: none;
            text-align: center;
            float: left;
            color: white;
            padding: 14px 16px;
        }
        div a:hover{
            background-color: white;
            color: black;
            transition-duration: .2s;
        }
        @media screen and (max-width:600px) {
            div a{
           float: none;         
           width: 100%;
            }            
        }
    </style>
</head>

<body>
    <div>
        <a href="#">Link 1</a>
        <a href="#">Link 2</a>
        <a href="#">Link 3</a>
        <a href="#">Link 4</a>
    </div>
    <p>responsive menu bar</p>
</body>

</html>
