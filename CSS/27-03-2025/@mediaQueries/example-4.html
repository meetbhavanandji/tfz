<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>backgroud color example</title>
    <style>
        body {
            background-color: cadetblue;
        }

        @media screen and (max-width:900px) {
            body {
                background-color: chartreuse;
            }
        }

        @media screen and (max-width:600px) {
            body {
                background-color: dodgerblue;
            }
        }
    </style>
</head>

<body>
    <div>
        <h1>Heading</h1>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Consectetur repellendus in impedit excepturi
            veritatis ab incidunt odit ratione porro quos! Nam, laborum dolore cumque assumenda velit repellat odit
            sequi ducimus.</p>
    </div>
</body>

</html>
