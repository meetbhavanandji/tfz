<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .column{
            float: left;
            width: 25%;
            padding: 20px;
            border: 2px solid black;
        }
        @media screen and (max-width:900px) {
            .column{
                width: 50%;
            }
        }
        @media screen and (max-width:600px) {
            .column{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="items">
        <div class="column">
            <h1>column1</h1>
        </div>
        <div class="column">
            <h1>column2</h1>
        </div>
        <div class="column">
            <h1>column3</h1>
        </div>
        <div class="column">
            <h1>column4</h1>
        </div>
    </div>
</body>
</html>
