<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grad {
            width: 200px;
            height: 200px;
            background-image: repeating-conic-gradient(red 10%, green 20%, blue 30%);
            border-radius: 50%;
        }
        #grad2 {
            width: 200px;
            height: 200px;
            background-image: repeating-conic-gradient(red 0deg,red 10deg, yellow 10deg,yellow 20deg, blue 20deg, blue 30deg);
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div id="grad"></div>
    <div id="grad2"></div>
</body>

</html>
