<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin-top: 100px;
            margin-left: 100px;
        }
        div {
            width: 100px;
            height: 60px;
            margin: 50px;
            background-color: lightgreen;
            border: 1px solid black;
        }
        
        div#item1:hover{
            transform: scale(1.5 , 1.5)
        }
        div#item2:hover{
            transform: scaleX(2)
        }
        div#item3:hover{
            transform: scaleY(2)
        }
        
    </style>
</head>

<body>
    <div id="item1"> scale  </div>
    <div id="item2"> scale X </div>
    <div id="item3"> scale Y </div>
</body>

</html>
