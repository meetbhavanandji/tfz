<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skew X</title>
    <style>
        body{
            margin-top: 100px;
            margin-left: 100px;
        }
        div {
            width: 200px;
            height: 60px;
            background-color: lightgreen;
            border: 1px solid black;
            margin-bottom: 100px;
        }
        
        div#item1:hover{
            /*transform: matrix(scaleX(), skewY(), skewX(), scaleY(), translateX(), translateY())*/
            transform:matrix(1.5, 0.5, 0.1, 1.5, 0, 0);
        }
        div#item2{
            transform:matrix(1.5, 0.5, 0.1, 1.5, 0, 0);
        }
        
    </style>
</head>

<body>
    <div id="item1"> hover me ! </div>
    <div>normal</div>
    <div id="item2">matrix(1.5, 0.5, 0.1, 1.5, 0, 0)</div>
</body>

</html>
