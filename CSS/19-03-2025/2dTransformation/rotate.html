<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin-top: 100px;
            margin-left: 100px;
        }
        div {
            width: 300px;
            height: 70px;
            background-color: lightgreen;
            border: 1px solid black;
        }
        div#item1{
            transform: rotate(20deg);
        }
        div#item2{
            transform: rotate(-20deg);
        }
    </style>
</head>

<body>
    <div id="item1"> transform: rotate(20deg) </div>
    <div>
        this is normal div
    </div>
    <div id="item2"> transform: rotate(-20deg) </div>
</body>

</html>
