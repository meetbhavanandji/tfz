<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 70px;
            background-color: lightgreen;
            border: 1px solid black;
        }
        div#item1{
            transform: translate(50px, -20px);
        }
    </style>
</head>

<body>
    <div>
        this is normal div
    </div>
    <div id="item1"> transform: translate(50px, -20px) </div>
</body>

</html>
