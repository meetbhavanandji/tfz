<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item{
            width: 100px ;
            height: 50px;
            padding: 20px;
            background-color: lightgreen;
            box-shadow: 10px 10px;
            margin-bottom: 20px;
        }
        .item2{
            width: 100px;
            height: 50px;
            padding: 20px;
            background-color: lightgreen;
            box-shadow: 10px 10px lightcoral;
            margin-bottom: 20px;
        }
        .item3{
            width: 100px;
            height: 50px;
            padding: 20px;
            background-color: lightgreen;
            box-shadow: 10px 10px 10px lightcoral ;
            margin-bottom: 25px;
        }
        .item4{
            width: 100px;
            height: 50px;
            padding: 20px;
            background-color: lightgreen;
            box-shadow: 10px 10px 10px 12px lightcoral;
            margin-bottom: 30px;
        }
        .item5{
            width: 100px;
            height: 50px;
            padding: 20px;
            background-color: lightgreen;
            box-shadow: 10px 10px 10px  lightcoral inset;
            margin-bottom: 20px;
        }
        .item6{
            width: 500px;
            height: 50px;
            padding: 20px;
            border: 1px solid black;
            box-shadow: 5px 5px  lightpink, 10px 10px  lightsalmon, 15px 15px  lightcoral ;
            margin-bottom: 40px;
        }
        .item7{
            width: 500px;
            height: 50px;
            padding: 20px;
            border: 1px solid black;
            box-shadow: 5px 5px 10px lightpink, 10px 10px 10px lightsalmon, 15px 15px 10px lightcoral ;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="item">box shadow</div>
    <div class="item2">box shadow with specific color</div>
    <div class="item3">box shadow with specific color and blur</div>
    <div class="item4">box shadow with spread radius</div>
    <div class="item5">box shadow with inset (inside)</div>
    <div class="item6">box shadow with multi color</div>
    <div class="item7">box shadow with multi color and blur</div>
</body>

</html>
