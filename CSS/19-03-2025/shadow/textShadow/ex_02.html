<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item1{
            text-shadow: 2px 2px 3px red, 2px 5px 5px blue;
        }
        .item2{
            color: white;
            text-shadow: 1px 1px 3px black, 0 0 25px blue, 0 0 10px darkblue;
        }
        .item3{
            color: white;
            text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }
    </style>
</head>
<body>
    <div class="item1"><h1>Text shadow effect with two color</h1></div>
    <div class="item2"><h1>Text shadow effect with three color</h1></div>
    <div class="item3"><h1>Border with Text shadow effect </h1></div>
</body>
</html>
