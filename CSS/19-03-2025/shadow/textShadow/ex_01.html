<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item1{
            text-shadow: 2px 2px;
        }
        .item2{
            text-shadow: 2px 2px lightcoral;
        }
        .item3{
            text-shadow: 5px 5px 5px lightcoral;
        }
        .item4{
            color: white;
            text-shadow: 2px 2px 4px lightcoral;
        }
        .item5{
            color: white;
            text-shadow: 0 0 3px #ff0000;
        }
    </style>
</head>
<body>
    <div class="item1"><h1>Text shadow effect</h1></div>
    <div class="item2"><h1>Text shadow effect with color</h1></div>
    <div class="item3"><h1>Text shadow effect with color and blur effect</h1></div>
    <div class="item4"><h1>Text shadow effect with white color</h1></div>
    <div class="item5"><h1>Text shadow effect with neon color</h1></div>
</body>
</html>
