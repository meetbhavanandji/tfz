<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item1{
            white-space: nowrap;
            width: 200px;
            border: 1px solid black;
            overflow: hidden;
            text-overflow: clip;
        }
        .item2{
            white-space: nowrap;
            width: 200px;
            border: 1px solid black;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item1:hover{
            overflow: visible;
        }
        .item2:hover{
            overflow: visible;
        }
    </style>
</head>
<body>
    <h1>Overflow</h1>
    <h2>text overflow clip</h2>
    <div class="item1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Assumenda, quaerat.</div>
    <h2>text overflow ellipsis</h2>
    <div class="item2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Assumenda, quaerat.</div>
</body>
</html>
