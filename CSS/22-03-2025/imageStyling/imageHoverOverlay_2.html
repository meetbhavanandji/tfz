<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>overlay</title>
    <style>
        .container{
            width: 20%;
            height: auto;
            position: relative;
        }
        .image{
            opacity: 1;
            display: block;
            width: 100%;
            height: auto;
            transition: 0.5s ease;
            backface-visibility: hidden;
        }
        .container_text{
            transition: 0.5s ease;
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .container:hover .image{
            opacity: 0.3;
        }
        .container:hover .container_text{
            opacity: 1;
        }
        .text{
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            padding: 16px 32px;
        }
    </style>
</head>
<body>
    <h4>Fade in box</h4>
    <div class="container">
        <img class="image" src="../pic/img_avatar.png" alt="avatar_img" style="width: 100%;">
        <div class="container_text"> 
            <div class="text">John Druw</div>
        </div>
    </div>
</body>
</html>
