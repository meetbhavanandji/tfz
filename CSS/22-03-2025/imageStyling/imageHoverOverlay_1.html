<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>overlay</title>
    <style>
        .container {
            position: relative;
            width: 20%
        }

        .image {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            transition: 0.5s ease;
            background-color: #008cba;

        }

        .container:hover .overlay {
            opacity: 1;
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 20px;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <h4>Fade in text</h4>
    <div class="container">
        <img class="image" src="../pic/img_avatar.png" alt="avater">
        <div class="overlay">
            <div class="text">overlay</div>
        </div>
    </div>
</body>

</html>
