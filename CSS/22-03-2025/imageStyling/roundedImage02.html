<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image as link</title>
    <style>
        img {
            width: 400px ;
            border: 1px solid darkgray;
            border-radius: 8px;
            opacity: 1;

        }

        img:hover {
            box-shadow: 0 0 5px 1px lightseagreen;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <a href="../pic/nature-3082832_1920.jpg" target="_blank">
        <img src="../pic/nature-3082832_1920.jpg" alt="nature_img" style="width:150px;">
    </a>
</body>

</html>
