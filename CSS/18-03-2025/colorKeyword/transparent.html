<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transparent keyword</title>
    <style>
        body{
            background: url(../pic/p1.png) no-repeat fixed;
            background-size: cover;
        }
        .item{
            text-align: center;
            background-color: transparent;
            padding: 20px;
            color: white;
            border: 2px solid whitesmoke;
            margin-bottom: 50px;
        }
        .item2{
            text-align: center;
            background-color: lightblue;
            padding: 20px;
            color: white;
            border: 2px solid whitesmoke;
        }
        
    </style>
</head>

<body>
    <div class="item" style="font-size: 30px;">
        This is some text with background transparent
    </div>
    <div class="item2" style="font-size: 30px;">
        This is some text with color background 
    </div>
</body>

</html>
