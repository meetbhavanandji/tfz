<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            color: white;
        }
        #gradiant1{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient(  red ,  blue);
            margin-bottom: 50px;
        }
        #gradiant2{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient(to right, red ,  blue);
            margin-bottom: 50px;
        }
        #gradiant3{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient(to bottom right, darkviolet ,  pink);
            margin-bottom: 50px;
        }
    </style>
</head>
<body>
    <div id="gradiant1">
        Top to Bottom
    </div>
    <div id="gradiant2">
        Left to Right
    </div>
    <div id="gradiant3">
        to bottom right
    </div>
</body>
</html>
