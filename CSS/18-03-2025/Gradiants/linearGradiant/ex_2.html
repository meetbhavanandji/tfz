<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #gradiant{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient(180deg,  red ,  blue);
            margin-bottom: 50px;
        }
        #gradiant2{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient( red ,  yellow, blue);
            margin-bottom: 50px;
        }
        #gradiant3{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient(to right, red,orange,yellow,green,blue,indigo,violet);
            margin-bottom: 50px;
        }
        #gradiant4{
            padding: 50px;
            text-align: center;
            background-image: linear-gradient(to right, rgba(255, 0, 0, 0), rgba(255, 0, 0, 1));
            margin-bottom: 50px;
        }
        #gradiant5{
            height: 100px;
            padding: 50px;
            text-align: center;
            background-image: repeating-linear-gradient(45deg, red, yellow 2%, blue 7%);
            margin-bottom: 50px;
        }
    </style>
</head>
<body>
    <div id="gradiant"></div>
    <div id="gradiant2"></div>
    <div id="gradiant3">RAINBOW COLOR</div>
    <div id="gradiant4">Transparency</div>
    <div id="gradiant5"  style="color: black;font-size: 25px;">Repeating linear gradiant</div>
</body>
</html>
