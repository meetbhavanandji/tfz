<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #item{
            width: 200px;
            height: 200px;
            background-image: radial-gradient(red 7%, yellow 10%, green 50%);
            margin-bottom: 50px;
        }
        #item2{
            width: 200px;
            height: 200px;
            background-image: radial-gradient(circle, red , yellow , green );
            margin-bottom: 50px;
        }
        #item3{
            width: 200px;
            height: 200px;
            background-image: repeating-radial-gradient(red,yellow 7%, green 20%);
        }
    </style>
</head>

<body>
    <div id="item"></div>
    <div id="item2"></div>
    <div id="item3"></div>
</body>

</html>
