<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> @property </title>
    <style>
        @property --back-colr {
            syntax: "<color>";
            inherits: true;
            initial-value: lightgray;
        }

        @property --txt-colr {
            syntax: "<color>";
            inherits: true;
            initial-value: darkblue;
        }

        div {
            width: 300px;
            height: 100px;
            padding: 15px;
            background-color: var(--back-colr);
            color: var(--txt-colr);
        }
    </style>
</head>

<body>
    <h1>@property rule</h1>
    <div>This is some text</div>
</body>

</html>
