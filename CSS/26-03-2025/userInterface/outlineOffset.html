<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Outline offset </title>
    <style>
        div.test-1{
            margin: 20px;
            border: 1px solid black;
            outline: 4px solid salmon;
            outline-offset: 10px;
        }
        div.test-2{
            margin: 20px;
            border: 1px solid black;
            outline: 4px dotted sandybrown;
            outline-offset: 10px;
        }
    </style>
</head>

<body>
    <div class="test-1">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Amet quam dolore eligendi nam hic
        fugiat.</div><br>
    <div class="test-2">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Amet quam dolore eligendi nam hic
        fugiat.</div>
</body>

</html>
