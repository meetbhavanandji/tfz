<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Resize </title>
    <style>
        div.horizontal {
            resize: horizontal;
            border: 2px solid;
            padding: 20px;
            width: 50%;
            overflow: auto;
            margin: 50px;
        }

        div.vertical {
            resize: vertical;
            border: 2px solid;
            padding: 20px;
            width: 50%;
            overflow: auto;
            margin: 50px;
        }

        div.both {
            resize: both;
            border: 2px solid;
            padding: 20px;
            width: 50%;
            overflow: auto;
            margin: 50px;
        }
    </style>
</head>

<body>
    <h2>Change the size of this element horizontally</h2>
    <div class="horizontal">
        risize this container
    </div>
    <hr>
    <h2>Change the size of this element vertically</h2>
    <div class="vertical">
        risize this container
    </div>
    <hr>
    <h2>Change the size of this element horizontally-vertically (both)</h2>
    <div class="both">
        risize this container
    </div>
</body>

</html>
