<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #box{
            text-align: center;
            width: 100px;
        }
        #line{
            width: 0px;
            height: 2px;
            background-color: lightslategray;
            transition: width 0.2s;
        }
        #box:hover + #line{
            width: 100px;
        }
    </style>
</head>
<body>
    <div id="box">HOVER
    </div>
    <div id="line"></div>
    
</body>
</html>
