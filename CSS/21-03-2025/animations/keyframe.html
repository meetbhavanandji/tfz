<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyframe</title>
    <style>
        .item {
            width: 100px;
            height: 100px;
            background-color: lightcoral;
            animation-name: box;
            animation-duration: 2s;
        }

        @keyframes box {
            from {
                background-color: lightcoral;
            }

            to {
                background-color: lightgreen;
            }
        }
    </style>
</head>

<body>
    <div class="item"></div>
</body>

</html>
