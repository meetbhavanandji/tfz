<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation iteration count</title>
    <style>
        .item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(black ,gray,  white);
            animation-name: box;
            animation-duration: 5s;
            /* animation-delay: 1s; */
            animation-iteration-count: infinite;
            animation-direction: reverse;
        }
        .item2 {
            position: relative;
            float: right ;
            top: 0px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(black ,gray,  white);
            animation-name: box;
            animation-duration: 5s;
            /* animation-delay: 1s; */
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
        }

         @keyframes box{
            100%{rotate: 360deg;}
         }
    </style>
</head>

<body>
    <div class="item"></div>
    <div class="item2"></div>
</body>

</html>
