<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation iteration count</title>
    <style>
        .item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(black, white);
            animation-name: box;
            animation-duration: 5s;
            /* animation-delay: 1s; */
            animation-iteration-count: infinite;

        }

        /* @keyframes box {
            0% {background-color: red; top: 0px; left: 0px;}
            25% {background-color: green; top: 0px; left: 200px;}
            50% {background-color: yellow; top: 200px; left: 200px;}
            75% {background-color: blue; top: 200px; left: 0px;}
            100% {background-color: red; top: 0px; left: 0px;}
        } */
         @keyframes box{
            100%{rotate: 360deg;}
         }
    </style>
</head>

<body>
    <div class="item"></div>
</body>

</html>
