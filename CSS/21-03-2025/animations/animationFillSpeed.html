<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            position: relative;
            width: 100px ;
            height: 50px;
            background-color: red;
            animation: move 3s;
            animation-delay: 2s;
            animation-fill-mode: both;
        }
        @keyframes move {
            
            from{ background-color: yellowgreen; left:0px}
            to{ left:400px}
        }
      
    </style>
</head>
<body>
    <div class="item"></div>
</body>
</html>
