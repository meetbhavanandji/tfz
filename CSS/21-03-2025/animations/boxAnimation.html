<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box animation</title>
    <style>
        .item {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: red;
            animation-name: box;
            animation-duration: 4s;
            animation-delay: -1s;

        }

        @keyframes box {
            0% {background-color: red; top: 0px; left: 0px;}
            25% {background-color: green; top: 0px; left: 200px;}
            50% {background-color: yellow; top: 200px; left: 200px;}
            75% {background-color: blue; top: 200px; left: 0px;}
            100% {background-color: red; top: 0px; left: 0px;}
        }
    </style>
</head>

<body>
    <div class="item"></div>
</body>

</html>
