<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation short hand</title>
    <style>
        .item{
            position: relative;
            width: 100px;
            height: 100px;
            background-color: red;
            /* animation-name: move;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-delay: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate; */
            animation: move 5s linear 2s infinite alternate;
        }
        @keyframes move{
            0%{background-color: red; top: 0px; left: 0px ;}
            25%{background-color: green; top: 0px; left: 200px ;}
            50%{background-color: yellow; top: 200px; left: 200px ;}
            75%{background-color: violet; top: 200px; left: 0px ;}
            100%{background-color: red; top: 0px; left: 0px ;}
        }
    </style>
</head>
<body>
    <div class="item"></div>
</body>
</html>
