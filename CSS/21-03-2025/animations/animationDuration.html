<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyframe</title>
    <style>
        .item {
            width: 100px;
            height: 100px;
            background-color: lightcoral;
            animation-name: box;
            animation-duration: 5s;

        }

        @keyframes box {
            0% {background-color: lightcoral;}
            20%{background-color: lightyellow;}
            40%{background-color: lightgoldenrodyellow;}
            60%{background-color: lightpink;}
            80% {background-color: lightcyan;}
            100%{background-color: lightcoral;}
        }
    </style>
</head>

<body>
    <div class="item"></div>
</body>

</html>
