<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opacity</title>
    <style>
        figure{
            display: inline-block;
        }
        .img1 {
            opacity: 0.2;
        }

        .img2 {
            opacity: 0.5;
        }

        .img3 {
            opacity: 1;
        }
    </style>
</head>

<body>
    <figure>
        <img class="img1" src="../pic/img_forest.jpg" alt="img_forest" width="300" height="200">
        <figcaption>opacity 0.2</figcaption>
    </figure>

    <figure>
        <img class="img2" src="../pic/img_forest.jpg" alt="img_forest" width="300" height="200">
        <figcaption>opacity 0.5</figcaption>
    </figure>

    <figure>
        <img class="img3" src="../pic/img_forest.jpg" alt="img_forest" width="300" height="200">
        <figcaption>opacity 1 (default)</figcaption>
    </figure>

</body>

</html>
