<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opacity</title>
    <style>
        .background{
            background: url(../pic/p1.png) repeat;
            border-radius: 10px ;
            padding: 20px;
        }
        .box{
            margin: 10px;
            background-color: #ffffff;
            border: 2px solid whitesmoke;
            border-radius: 10px;
            opacity: 0.4;
        }
        p{
            margin: 2%;
            color: #000000  ;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="box">
            <p>This is some text that is placed in the transparent box.</p>
        </div>
    </div>
</body>
</html>
