<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opacity</title>
    <style>
      div {
        background-color: rgba(240, 128, 128, 1);
        padding: 20px;
      }
      .one {
        background-color: rgba(240, 128, 128, 0.6);
      }
      .two {
        background-color: rgba(240, 128, 128, 0.3);
      }
      .three {
        background-color: rgba(240, 128, 128, 0.1);
      }
    </style>
  </head>
  <body>
    <div>opacity 1 (default)</div>
    <div class="one">opacity 0.6</div>
    <div class="two">opacity 0.3</div>
    <div class="three">opacity 0.1</div>
  </body>
</html>
