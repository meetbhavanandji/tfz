<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opacity</title>
    <style>
      div {
        background-color: lightcoral;
        padding: 20px;
      }
      .one {
        opacity: 0.6;
      }
      .two {
        opacity: 0.3;
      }
      .three {
        opacity: 0.1;
      }
    </style>
  </head>
  <body>
    <div>opacity 1 (default)</div>
    <div class="one">opacity 0.6</div>
    <div class="two">opacity 0.3</div>
    <div class="three">opacity 0.1</div>
  </body>
</html>
