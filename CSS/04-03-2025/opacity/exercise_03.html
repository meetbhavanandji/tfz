<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opacity</title>
    <style>
        img {
            opacity: 1;
        }

        img:hover {
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <h2>Hover on picture to see the effect</h2>
        <img class="img1" src="../pic/img_forest.jpg" alt="img_forest" width="300" height="200">
        <img class="img2" src="../pic/02.jpg" alt="img_forest" width="300" height="200">
        <img class="img3" src="../pic/01.jpg" alt="img_forest" width="300" height="200">
</body>

</html>
