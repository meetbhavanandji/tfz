<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z-index</title>
    <style>
        img{
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: -1;
        }
    </style>
  </head>
  <body>
    <h1>this is image</h1>
    <img src="../pics/img_tree.png" alt="img_tree">
    <p>
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Vitae beatae,
      sunt numquam earum rem, soluta facere consectetur consequatur minus maxime
      quod explicabo aspernatur magnam quasi tempora qui id. Ducimus, vel.
    </p>
  </body>
</html>
