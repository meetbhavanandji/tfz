<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .flex-container_01 {
      display: flex;
      flex-direction: row;
      background-color: DodgerBlue;
    }

    .flex-container_02 {
      display: flex;
      flex-direction: column;
      background-color: DodgerBlue;
    }

    .flex-container_03 {
      display: flex;
      flex-direction: row-reverse;
      background-color: DodgerBlue;
    }

    .flex-container_04 {
      display: flex;
      flex-direction: column-reverse;
      background-color: DodgerBlue;
    }

    .flex-container_01>div {
      background-color: #f1f1f1;
      width: 100px;
      margin: 10px;
      text-align: center;
      line-height: 75px;
      font-size: 30px;
    }

    .flex-container_02>div {
      background-color: #f1f1f1;
      width: 100px;
      margin: 10px;
      text-align: center;
      line-height: 75px;
      font-size: 30px;
    }

    .flex-container_03>div {
      background-color: #f1f1f1;
      width: 100px;
      margin: 10px;
      text-align: center;
      line-height: 75px;
      font-size: 30px;
    }

    .flex-container_04>div {
      background-color: #f1f1f1;
      width: 100px;
      margin: 10px;
      text-align: center;
      line-height: 75px;
      font-size: 30px;
    }
  </style>
</head>

<body>
  <h2>Flex Direction - Row</h2>
  <div class="flex-container_01">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
  <hr>
  <h2>Flex Direction - Column</h2>
  <div class="flex-container_02">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
  <hr>
  <h2>Flex Direction - Row-reverse</h2>
  <div class="flex-container_03">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
  <hr>
  <h2>Flex Direction - Column-reverse</h2>
  <div class="flex-container_04">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>


</body>

</html>
