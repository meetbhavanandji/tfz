<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        div {
            width: 200px;
            height: 100px;
            background-color: aqua;
            border: 1px solid black;
            margin: 50px;
        }

        div.item1 {
            transform: scaleX(2);
        }

        div.item2 {
            transform: skewY(20deg);
        }
    </style>
</head>

<body>
    <div class="item1">scale X 2 times</div>
    <div class="item2">skewY 90deg </div>
</body>

</html>
