<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perspective</title>
    <style>
        .item {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 350px;
            border: 1px solid black;
            padding: 20px;
            perspective: 95px;
        }

        .item2 {
            position: absolute;
            padding: 50px;
            background-color: lightcyan;
            border: 1px solid black;
            transform: rotateY(60deg);
        }
    </style>
</head>

<body>
    <div class="item">div1
        <div class="item2">Perspective</div>
    </div>
</body>

</html>
