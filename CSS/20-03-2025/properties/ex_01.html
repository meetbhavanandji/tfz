<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item {
            font-size: 30px;
            font-family: fantasy;
            padding: 20px;
            text-align: center;
            width: 300px;
            height: 40px;
            border: 5px solid lightgreen;
            background-color: lightcyan;
          
        }

        .item:hover{
          transform: scale3d(1, 1.2, 1);
            transform: rotate3d(41, 3, 0, -120deg);
            /* transform: translate3d(1px, 100px); */
            transition-duration: 1s;
        
        }
    </style>
</head>

<body>
    <div class="item">Hello World</div>
</body>

</html>
