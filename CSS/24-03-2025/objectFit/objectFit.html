<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image {
            width: 200px;
            height: 300px;
            object-fit: cover;
        }
        .image2 {
            width: 200px;
            height: 300px;
            object-fit: contain;
        }
        .image3 {
            width: 200px;
            height: 300px;
            object-fit: fill;
        }
        .image4 {
            width: 200px;
            height: 300px;
            object-fit: none;
        }
        .image5 {
            width: 200px;
            height: 300px;
            object-fit: scale-down;
        }
    </style>
</head>

<body>
    <div>
        <h3>object fit: cover</h3>
        <img src="./paris.jpg" alt="paris" class="image">
    </div>
    <div>
        <h3>object fit: contain</h3>
        <img src="./paris.jpg" alt="paris" class="image2">
    </div>
    <div>
        <h3>object fit: fill</h3>
        <img src="./paris.jpg" alt="paris" class="image3">
    </div>
    <div>
        <h3>object fit: none</h3>
        <img src="./paris.jpg" alt="paris" class="image4">
    </div>
    <div>
        <h3>object fit: scale-down</h3>
        <img src="./paris.jpg" alt="paris" class="image5">
    </div>
</body>

</html>
