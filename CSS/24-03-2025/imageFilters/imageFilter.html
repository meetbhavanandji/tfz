<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .blur img {
            width: 200px;
            height: 200px;
            filter: blur(0.9px);
        }
        .brightness img{
            width: 200px;
            height: 200px;
            filter: brightness(150%);
        }
        .contrast img{
            width: 200px;
            height: 200px;
            filter: contrast(170%);
        }
        .drop-shadow img{
            width: 200px;
            height: 200px;
            filter: drop-shadow(2px 4px 10px black);
        }
        .grayscale img{
            width: 200px;
            height: 200px;
            filter: grayscale(0.5);
        }
        .hue-rotate img{
            width: 200px;
            height: 200px;
            filter: hue-rotate(150deg);
        }
        .invert img{
            width: 200px;
            height: 200px;
            filter: invert(1);
        }
        .opacity img{
            width: 200px;
            height: 200px;
            filter: opacity(0.6);
        }
        .saturate img{
            width: 200px;
            height: 200px;
            filter: saturate(2);
        }
        .sepia img{
            width: 200px;
            height: 200px;
            filter: sepia(1)
        }

    </style>
</head>
<body>
    <div class="blur">
        <h3>Blur</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="brightness">
        <h3>brightness</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="contrast">
        <h3>contrast</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="drop-shadow">
        <h3>drop-shadow</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="grayscale">
        <h3>grayscale</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="hue-rotate">
        <h3>hue-rotate</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="invert">
        <h3>invert</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="opacity">
        <h3>opacity</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="saturate">
        <h3>saturate</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
    <div class="sepia">
        <h3>sepia</h3>
        <img src="./pineapple.jpg" alt="pineapple">
    </div>
</body>
</html>
