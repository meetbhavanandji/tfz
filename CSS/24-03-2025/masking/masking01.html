<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .mask{
            mask-image: url(./w3logo.png);
            -webkit-mask-image: url(./w3logo.png);
            mask-repeat: no-repeat;
        }
        .mask2{
            mask-image: url(./w3logo.png);
            -webkit-mask-image: url(./w3logo.png);
            /* mask-repeat: no-repeat; */
        }
    </style>
</head>
<body>
    <h3>Masking image</h3>
    <div class="mask">
        <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="img_5terre">
    </div>
    <hr>
    <h3>Masking image repeating</h3>
    <div class="mask2">
        <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="img_5terre">
    </div>
    <hr>
    <h3>Original image</h3>
    <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="img_5terre">
</body>
</html>
