<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .mask1 {
            -webkit-mask-image: radial-gradient(circle, black 50%, rgba(0, 0, 0, 0.5) 60%);
            mask-image: radial-gradient(circle, black 50%, rgba(0, 0, 0, 0.5) 60%);
            width: 600px;
            height: 400px;
        }
      
        .mask2 {
            -webkit-mask-image: radial-gradient(ellipse, black 50%, rgba(0, 0, 0, 0.5) 60%);
            mask-image: radial-gradient(ellipse, black 50%, rgba(0, 0, 0, 0.5) 60%);
            width: 600px;
            height: 400px;
        }
    </style>
</head>

<body>
    <h2>radial gradiant(circle)</h2>
    <div class="mask1">
        <img src="https://www.w3schools.com/css/img_5terre.jpg" >
    </div>
    
    <h2>radial gradiant(ellipse)</h2>
    <div class="mask2">
        <img src="https://www.w3schools.com/css/img_5terre.jpg" >
    </div>
</body>

</html>
