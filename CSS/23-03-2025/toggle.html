<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toggle</title>
    <style>
        input {
            display: none;
            visibility: hidden;
            /* -webkit-appearance: none; */
        }

        .toggle {
            position: absolute;
            height: 30px;
            width: 30px;
            top: 50px;
            left: 15px;
            z-index: 1;
            cursor: pointer;
            border-radius: 2px;
            background-color: brown;
            background-color: white;
            /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.2); */

        }

        .toggle .common {
            position: absolute;
            width: 20px;
            height: 2.5px;
            background: linear-gradient(#bcb3e5, #887eb6);
            border-radius: 50px;
            transition: 0.3s ease;

        }

        .toggle .top-line {
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .toggle .middle-line {
            width: 15px;
            top: 50.5%;
            left: 60%;
            transform: translate(-50%, -50%);
        }

        .toggle .last-line {
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        input:checked+.toggle .top-line {
            left: 7px;
            top: 14px;
            width: 15px;
            transform: rotate(45deg);
            transition-duration: 0.1s;
        }
        

        input:checked+.toggle .last-line {
            left: 7px;
            top: 14px;
            width: 15px;
            transform: rotate(-45deg);
            transition-duration: 0.1s;

        }

        input:checked+.toggle .middle-line {
            transform: translateX(20px);
            transition-duration: 0s;
            opacity: 0;
        }
    </style>
</head>

<body>
    <label>
        <input type="checkbox">
        <div class="toggle">
            <span class="top-line common"></span>
            <span class="middle-line common"></span>
            <span class="last-line common"></span>
        </div>
    </label>
</body>

</html>
