<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        q:lang(no){
            quotes: "#" "#";
        }
    </style>
</head>
<body>
    <h3>Style the quotation marks for q elements with lang="no"</h3>
    <p>This is sample text here is <q lang="no">quote word</q> and this is also sample text.</p>
</body>
</html>
