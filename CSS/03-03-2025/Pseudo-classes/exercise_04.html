<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        p{
            display: none;
            padding: 20px;
            background-color: yellow;
        }
        div:hover p{
            display: block;
        }
    </style>
</head>
<body>
    <div>
        When you hover here you see the p tag
        <p>I am here !</p> 
    </div>
</body>
</html>
