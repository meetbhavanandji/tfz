<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        i:first-child  {
            color: blue;
        }
    </style>
</head>
<body>
    <h3>Style any i element that is the first child of a p element</h3>
    <p>This is <i>some</i> text. This is <i>some</i> text.</p>
    <p>This is <i>some</i> text. This is <i>some</i> text.</p>
</body>
</html>
