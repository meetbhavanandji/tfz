<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        div{
            background-color: lightblue;
            color: white;
            text-align: center;
            padding: 20px;
        }
        div:hover{
            background-color: lightcoral;
        } 
    </style>
</head>
<body>
    <h2>Hover on whole div </h2>
    <div>Mouse over me</div>
</body>
</html>
