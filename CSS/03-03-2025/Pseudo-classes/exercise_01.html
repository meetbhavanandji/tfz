<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Pseudo-classes</title>
    <style>
      a:link {
        /*link-unvisited */
        color: darkblue;
      }
      a:visited {
        /*link-visited */
        color: green;
      }
      a:hover {
        /*link-hover */
        color: lightblue;
      }
      a:active {
        /*link-active */
        color: red;
      }
    </style>
  </head>
  <body>
    <div>
      <a href="http://www.youtube.com" target="_blank">This is link</a>
    </div>

    <p>
     <strong>Note:</strong> a:hover MUST come after a:link and a:visited in the CSS definition
      in order to be effective! a:active MUST come after a:hover in the CSS
      definition in order to be effective! Pseudo-class names are not
      case-sensitive.
    </p>
  </body>
</html>
