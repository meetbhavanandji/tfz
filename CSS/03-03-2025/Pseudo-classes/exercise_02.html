<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        a.one:hover{
            font-size: 20px;
            color: red;
        } 
    </style>
</head>
<body>
    <p><a class="one" href="http://www.youtube.com" target="_blank">Mouse over me </a></p>
</body>
</html>
