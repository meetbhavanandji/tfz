<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinator</title>
    <style>
        div ~ p {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h2>Subsequent-sibling Combinator (~)</h2>
    <div>
        <p>This is some text</p>
        <p>This is some text</p>
        <p>This is some text</p>
    </div>
    <p>This is some text</p>
    <p>This is some text</p>
    <p>This is some text</p>

</body>
</html>
