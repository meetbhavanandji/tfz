<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .center {
        height: 500px;
        position: relative;
        border: 3px solid lightgreen;
      }
       p {
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <h2> Centered vertically using position and transform </h2>
    <div class="center">
      <p>This is some text.</p>
    </div>
  </body>
</html>
