        .footer {

            border-right: 3px outset #C0B7E8;

        }

        .naw {
            display: flex;
            flex-direction: column;

        .naw a {

        }

        }

            font-size: 16px;

            display: flex;
            flex-direction: column;

        }

       

        #in {
            margin-left: 10px;
        }

        .byw {
            background: linear-gradient(45deg, #8176AF, #C0B7E8);

            padding: 12px 0;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: #343045;
        }

        .byw:hover {
            opacity: 0.7;
        }

        #line-ani {
            width: 0px;
            height: 2px;
            background-color: lightslategray;
            transition: width 0.1s;
        }

        a:hover+#line-ani {

        }

        .lan {

            width: 1269px;
            height: 1px;

        .lan2 {

            align-items: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
        }

        .copy {
            color: #ffffff;
            text-decoration: none;
        }
