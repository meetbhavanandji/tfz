<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Landing Page</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img class="logo01" src="./assests/logo.png" alt="Hydra Logo">
            <img class="logo02" src="./assests/logo-name.png" alt="Hydra Name">
        </div>

        <input type="checkbox" id="nav-toggle">
        <label for="nav-toggle" class="hamburger">☰</label>

        <nav>
            <ul>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SERVICES</a></li>
                <li><a href="#">TECHNOLOGIES</a></li>
                <li><a href="#">HOW TO</a></li>
            </ul>
        </nav>
        <div class="buttons">
            <button class="contact-btn">CONTACT US</button>
            <button class="join-btn">JOIN HYDRA</button>
        </div>
    </header>


    <div class="front">
        <section class="hero">
            <div class="hero-content">
                <h2><span class="highlight">Dive</span> Into The Depths <br> Of <span class="highlight">Virtual
                        Reality</span></h2>
                <p>Lorem, ipsum dolor sit amet, consectetur adipisicing elit, <br> sed do eiusmod tempor incididunt ut
                    labore et
                    dolore <br> nisl tincidunt eget. Lectus mauris eros in vitae.</p>
                <button class="cta-btn">BUILD YOUR WORLD</button>
                <img class="cta-btn1" src="./assests/arrow-small-right.png" alt="">
            </div>
            <div class="hero-image">
                <img src="./assests/Mask group.png" alt="VR Experience">


            </div>
        </section>
        <div class="vectors">
            <img class="vector4" src="./assests/Vector 4.png" alt="">
            <img class="vector2" src="./assests/Vector 2.png" alt="">
            <img class="vector3" src="./assests/Vector 3.png" alt="">
            <img class="vector1" src="./assests/Vector 1.png" alt="">
        </div>
    </div>
</body>

</html>
