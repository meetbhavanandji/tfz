<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #302c42;
            color: white;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background-color: #302c42;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            column-gap: 1rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .contact-btn, .join-btn {
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 20px;
            background: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .join-btn {
            background: linear-gradient(45deg, #b39ddb, #9575cd);
            border: none;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #nav-toggle {
            display: none;
        }
        
        #nav-toggle:checked ~ .hamburger {
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            nav ul {
                display: block;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: #302c42;
                width: 100%;
                padding: 0;
                text-align: center;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.5s ease-in-out;
                box-shadow: 0 5px 10px rgba(0,0,0,0.2);
                z-index: 100;
            }
            
            nav ul li {
                padding: 0;
                opacity: 0;
                transform: translateY(-20px);
                transition: opacity 0.3s ease, transform 0.3s ease;
                transition-delay: 0s;
            }
            
            nav ul li a {
                display: block;
                padding: 15px 0;
            }

            #nav-toggle:checked ~ nav ul {
                max-height: 300px;
            }
            
            #nav-toggle:checked ~ nav ul li {
                opacity: 1;
                transform: translateY(0);
            }
            
            #nav-toggle:checked ~ nav ul li:nth-child(1) { transition-delay: 0.1s; }
            #nav-toggle:checked ~ nav ul li:nth-child(2) { transition-delay: 0.2s; }
            #nav-toggle:checked ~ nav ul li:nth-child(3) { transition-delay: 0.3s; }
            #nav-toggle:checked ~ nav ul li:nth-child(4) { transition-delay: 0.4s; }

            .buttons {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="../picture/logo.png" alt="Hydra Logo">
            <img src="../picture/logo-name.png" alt="Hydra Name">
        </div>
        <input type="checkbox" id="nav-toggle">
        <label for="nav-toggle" class="hamburger">☰</label>
        <nav>
            <ul>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SERVICES</a></li>
                <li><a href="#">TECHNOLOGIES</a></li>
                <li><a href="#">HOW TO</a></li>
            </ul>
        </nav>
        <div class="buttons">
            <button class="contact-btn">CONTACT US</button>
            <button class="join-btn">JOIN HYDRA</button>
        </div>
    </header>
</body>

</html>
